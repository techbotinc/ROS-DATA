<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
    <title>ROS Site- NOMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script 

src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0

/mammoth.browser.min.js"></script>
    <script 

src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link 

href="https://cdnjs.cloudflare.com/ajax/libs/font-

awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?

family=Plus+Jakarta

+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(226, 232, 240, 0.8);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
            margin: 0;
            padding-bottom: 90px; /* Space for the bottom 

nav */
        }

        .glass-effect { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--glass-border); 
        }

        .bottom-nav-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
        }
        
        .status-resident { background: #dcfce7; color: 

#166534; border-left: 4px solid #22c55e; }
        .status-under-con { background: #fef9c3; color: 

#854d0e; border-left: 4px solid #eab308; }
        .status-boundary { background: #ffedd5; color: 

#9a3412; border-left: 4px solid #f97316; }
        .status-empty { background: #fee2e2; color: 

#991b1b; border-left: 4px solid #ef4444; }

        .nav-active { color: #2563eb; transform: 

translateY(-2px); }
        .no-scrollbar::-webkit-scrollbar { display: none; 

}
        
        .animate-slide-up { animation: slideUp 0.3s 

cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: 

translateY(100%); } to { transform: translateY(0); } }

        /* Fix for card clicking smoothness */
        .plot-card {
            transition: transform 0.2s ease, box-shadow 

0.2s ease;
            cursor: pointer;
        }
        .plot-card:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <header class="sticky top-0 z-40 glass-effect px-6 

py-5 shadow-sm">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center 

mb-4">
                <h1 id="pageTitle" class="text-2xl font-

extrabold tracking-tight">ROS <span class="text-blue-

600">Home</span></h1>
                <div class="flex gap-3">
                    <button onclick="toggleModal

('recordModal')" class="bg-blue-600 text-white w-10 h-10 

rounded-xl shadow-lg flex items-center justify-center 

active:scale-90 transition-transform">
                        <i class="fas fa-plus"></i>
                    </button>
                    <label class="bg-white border 

border-slate-200 text-slate-500 w-10 h-10 rounded-xl flex 

items-center justify-center cursor-pointer hover:bg-

slate-50 shadow-sm">
                        <i class="fas fa-file-

import"></i>
                        <input type="file" id="fileInput" 

class="hidden" accept=".docx" 

onchange="syncWordToOfflineDB(this)">
                    </label>
                </div>
            </div>
            
            <div id="searchSection" class="space-y-4">
                <div class="relative">
                    <input type="text" id="searchInput" 

placeholder="Search Plot, Name, ID, or Phone..." 

class="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-white/50 

border border-slate-100 outline-none focus:ring-2 

focus:ring-blue-500/20 font-medium" 

oninput="debounceSearch()">
                    <i class="fas fa-search absolute 

left-4 top-4 text-slate-300"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 mt-4">
        <div id="homeTab">
            <div id="resultsCount" class="mb-4 text-

[10px] font-extrabold text-slate-400 text-center 

tracking-[0.2em] uppercase">Initializing...</div>
            <div id="resultsList" class="space-y-4 pb-

10">
                </div>
        </div>

        <div id="summaryTab" class="hidden">
            <div class="bg-white p-8 rounded-[2.5rem] 

shadow-xl shadow-slate-200/50 mb-8 mt-4">
                <canvas id="statusChart" class="max-h-

[250px] mx-auto"></canvas>
            </div>
            <div id="statCards" class="grid grid-cols-1 

gap-4 pb-10"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 

bottom-nav-glass px-10 py-4 flex justify-around items-

center">
        <button onclick="switchTab('home')" id="homeBtn" 

class="flex flex-col items-center gap-1 nav-active 

transition-all">
            <i class="fas fa-house-chimney text-xl"></i>
            <span class="text-[9px] font-black uppercase 

tracking-widest">Home</span>
        </button>
        <button onclick="switchTab('summary')" 

id="summaryBtn" class="flex flex-col items-center gap-1 

text-slate-400 transition-all">
            <i class="fas fa-chart-pie text-xl"></i>
            <span class="text-[9px] font-black uppercase 

tracking-widest">Summary</span>
        </button>
    </nav>

    <div id="detailOverlay" class="fixed inset-0 z-[60] 

hidden bg-slate-900/40 backdrop-blur-md flex items-end 

justify-center">
        <div class="bg-white w-full max-w-md rounded-t-

[3rem] p-8 shadow-2xl relative animate-slide-up">
            <button onclick="closeDetail()" 

class="absolute right-6 top-6 w-10 h-10 bg-slate-100 

rounded-full flex items-center justify-center text-

slate-400">
                <i class="fas fa-times"></i>
            </button>
            <div class="w-12 h-1 bg-slate-200 rounded-

full mx-auto mb-6"></div>
            <div id="detailViewBody"></div>
        </div>
    </div>

    <div id="recordModal" class="fixed inset-0 z-[70] 

hidden bg-slate-900/60 backdrop-blur-sm flex items-center 

justify-center px-6">
        <div class="bg-white w-full max-w-sm rounded-

[2.5rem] p-8 shadow-2xl">
            <h2 class="font-extrabold text-xl mb-6">Plot 

Entry</h2>
            <form id="recordForm" class="grid grid-cols-2 

gap-4 text-sm">
                <input type="hidden" id="editId">
                <input type="text" id="m_name" 

placeholder="Name" class="col-span-2 bg-slate-50 p-4 

rounded-xl outline-none" required>
                <input type="text" id="m_phone" 

placeholder="Phone" class="col-span-2 bg-slate-50 p-4 

rounded-xl outline-none" required>
                <input type="text" id="m_membership" 

placeholder="Membership ID" class="col-span-2 bg-slate-50 

p-4 rounded-xl outline-none">
                <input type="text" id="m_block" 

placeholder="Block" class="bg-slate-50 p-4 rounded-xl 

outline-none" required>
                <input type="text" id="m_plot" 

placeholder="Plot #" class="bg-slate-50 p-4 rounded-xl 

outline-none" required>
                <select id="m_status" class="col-span-2 

bg-slate-50 p-4 rounded-xl outline-none font-bold">
                    <option 

value="RESIDENT">RESIDENT</option>
                    <option value="UNDER 

CONSTRUCTION">UNDER CONSTRUCTION</option>
                    <option value="BOUNDARY 

WALL">BOUNDARY WALL</option>
                    <option value="EMPTY">EMPTY</option>
                </select>
                <button type="button" 

onclick="toggleModal('recordModal')" class="p-4 font-bold 

text-slate-400">Cancel</button>
                <button type="submit" class="bg-blue-600 

text-white rounded-xl font-bold">Save</button>
            </form>
        </div>
    </div>

    <script>
        let db;
        let myChart = null;
        const DB_NAME = "ROSSiteDB_Final_V10";
        const STORE_NAME = "records";

        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore(STORE_NAME, { keyPath: 

"id", autoIncrement: true });
        };
        request.onsuccess = (e) => { db = 

e.target.result; loadData(); };

        function switchTab(tab) {
            const isHome = tab === 'home';
            document.getElementById

('homeTab').classList.toggle('hidden', !isHome);
            document.getElementById

('summaryTab').classList.toggle('hidden', isHome);
            document.getElementById

('searchSection').classList.toggle('hidden', !isHome);
            
            document.getElementById('homeBtn').className 

= isHome ? 'flex flex-col items-center gap-1 nav-active' 

: 'flex flex-col items-center gap-1 text-slate-400';
            document.getElementById

('summaryBtn').className = !isHome ? 'flex flex-col 

items-center gap-1 nav-active' : 'flex flex-col items-

center gap-1 text-slate-400';
            
            document.getElementById

('pageTitle').innerHTML = isHome ? 'ROS <span 

class="text-blue-600">Home</span>' : 'ROS <span 

class="text-blue-600">Stats</span>';
            if(!isHome) updateSummary();
        }

        function loadData() {
            const query = document.getElementById

('searchInput').value.toLowerCase();
            db.transaction(STORE_NAME).objectStore

(STORE_NAME).getAll().onsuccess = (e) => {
                let data = e.target.result;
                if (query) {
                    data = data.filter(r => 
                        r.name.toLowerCase().includes

(query) || 
                        r.plot.includes(query) || 
                        r.phone.includes(query) ||
                        (r.membership && 

r.membership.toLowerCase().includes(query))
                    );
                }
                renderUI(data);
            };
        }

        function renderUI(data) {
            const list = document.getElementById

('resultsList');
            document.getElementById

('resultsCount').innerText = `${data.length} RECORDS 

FOUND`;
            list.innerHTML = data.map(r => `
                <div onclick="showDetail(${r.id})" 

class="plot-card bg-white p-5 rounded-2xl shadow-sm flex 

justify-between items-center border border-slate-50">
                    <div>
                        <p class="text-[10px] font-black 

text-blue-500 uppercase tracking-wider mb-1">B-${r.block} 

• P-${r.plot} • ID: ${r.membership || '---'}</p>
                        <h3 class="text-[15px] font-bold 

text-slate-700 uppercase">${r.name}</h3>
                    </div>
                    <span class="text-[8px] font-black 

px-2.5 py-1 rounded-full uppercase ${getStatusStyling

(r.status)}">${r.status}</span>
                </div>
            `).join('');
        }

        function showDetail(id) {
            db.transaction(STORE_NAME).objectStore

(STORE_NAME).get(id).onsuccess = (e) => {
                const r = e.target.result;
                document.getElementById

('detailViewBody').innerHTML = `
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-black 

text-slate-800 uppercase">${r.name}</h2>
                        <span class="text-[10px] font-

black px-5 py-1.5 rounded-full uppercase mt-3 inline-

block ${getStatusStyling(r.status)}">${r.status}</span>
                    </div>
                    <div class="bg-slate-50 rounded-3xl 

p-6 space-y-4 mb-8">
                        <div class="flex justify-

between"><span class="text-slate-400 font-bold uppercase 

text-[9px]">Member ID</span><span class="font-bold text-

blue-600">${r.membership || 'N/A'}</span></div>
                        <div class="flex justify-

between"><span class="text-slate-400 font-bold uppercase 

text-[9px]">Location</span><span class="font-bold">Block 

${r.block}, Plot ${r.plot}</span></div>
                        <div class="flex justify-

between"><span class="text-slate-400 font-bold uppercase 

text-[9px]">Phone</span><span class="font-bold">

${r.phone}</span></div>
                    </div>
                    <div class="flex gap-3">
                        <a href="tel:${r.phone}" 

class="flex-1 bg-slate-900 text-white h-16 rounded-2xl 

flex items-center justify-center gap-2 font-bold 

uppercase text-xs shadow-xl">
                            <i class="fas fa-phone"></i> 

Call
                        </a>
                        <button onclick="editRecord

(${r.id})" class="w-16 h-16 bg-blue-50 text-blue-600 

rounded-2xl"><i class="fas fa-edit"></i></button>
                    </div>
                `;
                document.getElementById

('detailOverlay').classList.remove('hidden');
            };
        }

        function updateSummary() {
            db.transaction(STORE_NAME).objectStore

(STORE_NAME).getAll().onsuccess = (e) => {
                const d = e.target.result;
                const s = { 
                    R: d.filter

(x=>x.status==='RESIDENT').length, 
                    C: d.filter(x=>x.status==='UNDER 

CONSTRUCTION').length, 
                    B: d.filter(x=>x.status==='BOUNDARY 

WALL').length, 
                    E: d.filter

(x=>x.status==='EMPTY').length 
                };
                
                if(myChart) myChart.destroy();
                myChart = new Chart

(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Resident', 

'Construction', 'Boundary', 'Empty'],
                        datasets: [{ data: [s.R, s.C, 

s.B, s.E], backgroundColor: ['#22c55e', '#eab308', 

'#f97316', '#ef4444'], borderWidth: 0 }]
                    },
                    options: { cutout: '80%', plugins: { 

legend: { display: false } } }
                });

                document.getElementById

('statCards').innerHTML = `
                    <div class="bg-white p-5 rounded-2xl 

flex justify-between shadow-sm border-l-4 border-green-

500"><span>Resident</span><span class="font-bold">${s.R}

</span></div>
                    <div class="bg-white p-5 rounded-2xl 

flex justify-between shadow-sm border-l-4 border-yellow-

500"><span>Construction</span><span class="font-bold">

${s.C}</span></div>
                    <div class="bg-white p-5 rounded-2xl 

flex justify-between shadow-sm border-l-4 border-orange-

500"><span>Boundary</span><span class="font-bold">${s.B}

</span></div>
                    <div class="bg-white p-5 rounded-2xl 

flex justify-between shadow-sm border-l-4 border-red-

500"><span>Empty</span><span class="font-bold">${s.E}

</span></div>
                `;
            };
        }

        async function syncWordToOfflineDB(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const result = await 

mammoth.convertToHtml({ arrayBuffer: e.target.result });
                const tempDiv = document.createElement

('div');
                tempDiv.innerHTML = result.value;
                const rows = Array.from

(tempDiv.querySelectorAll('tr'));
                const tx = db.transaction(STORE_NAME, 

"readwrite");
                const store = tx.objectStore(STORE_NAME);
                rows.forEach(row => {
                    const cells = Array.from

(row.querySelectorAll('td')).map(td => td.innerText.trim

());
                    if (cells.length >= 7 && !cells

[0].toLowerCase().includes('s/n')) {
                        let rawStatus = cells

[7]?.toUpperCase() || 'EMPTY';
                        let finalStatus = 

rawStatus.includes('RESIDENT') ? 'RESIDENT' : 
                                          

rawStatus.includes('CONSTRUCTION') ? 'UNDER CONSTRUCTION' 

:
                                          

rawStatus.includes('BOUNDARY') ? 'BOUNDARY WALL' : 

'EMPTY';
                        store.put({ sn: cells[0], block: 

cells[1].toUpperCase(), street: cells[2], membership: 

cells[3].toUpperCase(), plot: cells[4], name: cells

[5].toUpperCase(), phone: cells[6], status: finalStatus 

});
                    }
                });
                tx.oncomplete = () => loadData();
            };
            reader.readAsArrayBuffer(file);
        }

        function getStatusStyling(s) {
            return s === 'RESIDENT' ? 'status-resident' : 

s === 'UNDER CONSTRUCTION' ? 'status-under-con' : s === 

'BOUNDARY WALL' ? 'status-boundary' : 'status-empty';
        }

        function editRecord(id) {
            closeDetail();
            db.transaction(STORE_NAME).objectStore

(STORE_NAME).get(id).onsuccess = (e) => {
                const r = e.target.result;
                document.getElementById('editId').value = 

r.id;
                document.getElementById('m_name').value = 

r.name;
                document.getElementById('m_phone').value 

= r.phone;
                document.getElementById

('m_membership').value = r.membership || '';
                document.getElementById('m_block').value 

= r.block;
                document.getElementById('m_plot').value = 

r.plot;
                document.getElementById('m_status').value 

= r.status;
                toggleModal('recordModal');
            };
        }

        document.getElementById('recordForm').onsubmit = 

(e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById

('m_name').value.toUpperCase(),
                phone: document.getElementById

('m_phone').value,
                membership: document.getElementById

('m_membership').value.toUpperCase(),
                block: document.getElementById

('m_block').value.toUpperCase(),
                plot: document.getElementById

('m_plot').value,
                status: document.getElementById

('m_status').value
            };
            const id = document.getElementById

('editId').value;
            if (id) data.id = Number(id);
            const tx = db.transaction(STORE_NAME, 

"readwrite");
            tx.objectStore(STORE_NAME).put(data);
            tx.oncomplete = () => { toggleModal

('recordModal'); loadData(); };
        };

        function toggleModal(id) { 

document.getElementById(id).classList.toggle('hidden'); }
        function closeDetail() { document.getElementById

('detailOverlay').classList.add('hidden'); }
        let searchTimeout;
        function debounceSearch() { clearTimeout

(searchTimeout); searchTimeout = setTimeout(loadData, 

300); }
    </script>
</body>
</html>
